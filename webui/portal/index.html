<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PPR26 工具中心</title>
    <link rel="icon" type="image/svg+xml" href="resistor_box_logo.svg">
    <link rel="stylesheet" href="style.css?v=portal-3">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="brand">
                <img class="brand-icon" src="resistor_box_logo.svg" alt="PPR26 logo">
                <h1 data-i18n="app_title">PPR26 工具中心</h1>
            </div>
            <div class="header-actions">
                <button id="themeToggle" class="icon-btn" data-i18n-title="toggle_theme">◐</button>
                <button id="langToggle" class="icon-btn" data-i18n-title="toggle_lang">EN</button>
            </div>
        </header>

        <main>
            <section class="card">
                <h2 data-i18n="entry_title">功能入口</h2>
                <p class="entry-desc" data-i18n="entry_desc">选择一个功能开始使用：</p>
                <div class="entry-grid">
                    <!-- href 由 app.js 按当前界面语言改写，指向对应语言的文档 -->
                    <a id="docsEntry" href="docs/zh_CN/" class="entry-item">
                        <span class="entry-icon">
                            <!-- 文档 / 书 -->
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
                                <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
                            </svg>
                        </span>
                        <div class="entry-text">
                            <h3 data-i18n="entry_docs">在线文档</h3>
                            <p data-i18n="entry_docs_desc">查看 PPR26 设备规格、快速上手与参考文档</p>
                        </div>
                        <span class="entry-arrow">→</span>
                    </a>
                    <a href="bootloader/" class="entry-item">
                        <span class="entry-icon">
                            <!-- 扳手 / 升级工具 -->
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path>
                            </svg>
                        </span>
                        <div class="entry-text">
                            <h3 data-i18n="entry_bootloader">Bootloader 升级工具</h3>
                            <p data-i18n="entry_bootloader_desc">通过 WebUSB 连接设备并升级固件</p>
                        </div>
                        <span class="entry-arrow">→</span>
                    </a>
                    <a href="serial/" class="entry-item">
                        <span class="entry-icon">
                            <!-- RS232 / 串口接口（简化为壳体 + 3 针，22px 下仍可分辨） -->
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M3.5 5.5h17l-2 13h-13z"></path>
                                <circle cx="7.8" cy="12" r="1.3" fill="currentColor" stroke="none"></circle>
                                <circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"></circle>
                                <circle cx="16.2" cy="12" r="1.3" fill="currentColor" stroke="none"></circle>
                            </svg>
                        </span>
                        <div class="entry-text">
                            <h3 data-i18n="entry_serial">AT 串口上位机</h3>
                            <p data-i18n="entry_serial_desc">通过 WebSerial 在浏览器中控制 PPR26 设备（AT 模式）</p>
                        </div>
                        <span class="entry-arrow">→</span>
                    </a>
                    <a href="ntcsim/" class="entry-item">
                        <span class="entry-icon">
                            <!-- 热敏电阻：NTC 符号 + 温度曲线（22px 下仍可分辨） -->
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M4 4v16h3"></path>
                                <path d="M7 12h9l-3.2-4.6M16 12l-3.2 4.6"></path>
                                <path d="M19 8.5h2M19 12h2M19 15.5h1.4"></path>
                            </svg>
                        </span>
                        <div class="entry-text">
                            <h3 data-i18n="entry_ntcsim">NTC 模拟器</h3>
                            <p data-i18n="entry_ntcsim_desc">把 PPR26 当作热敏电阻：按 B 值法 / Steinhart-Hart / CSV 数据把温度换算成阻值并下发</p>
                        </div>
                        <span class="entry-arrow">→</span>
                    </a>
                </div>
            </section>
        </main>
    </div>

    <script src="app.js?v=portal-3"></script>
</body>
</html>
