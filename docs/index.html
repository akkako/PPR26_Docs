<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PPR26 文档 / Documentation</title>
    <link rel="icon" type="image/svg+xml" href="zh_CN/assets/resistor_box_logo.svg">
    <script>
        // 按浏览器语言直接进入对应语言的文档。
        // 使用 replace 避免用户按「后退」时又被弹回本页。
        (function () {
            var lang = (navigator.languages && navigator.languages[0]) || navigator.language || "";
            var target = /^zh\b/i.test(lang) ? "zh_CN/" : "en/";
            location.replace(target);
        })();
    </script>
    <style>
        :root { color-scheme: light dark; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.25rem;
            font-family: "Roboto", "Helvetica Neue", Arial, "Microsoft YaHei", sans-serif;
            background: #fafafa;
            color: #333;
        }
        @media (prefers-color-scheme: dark) {
            body { background: #1e1e1e; color: #ddd; }
            a { color: #9fa8ff; }
        }
        h1 { margin: 0; font-size: 1.5rem; font-weight: 500; letter-spacing: .02em; }
        p { margin: 0; font-size: .95rem; opacity: .8; }
        nav { display: flex; gap: 1.5rem; font-size: 1rem; }
        a { color: #3f51b5; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <h1>PPR26</h1>
    <p>正在按浏览器语言选择文档… / Selecting documentation language…</p>
    <nav>
        <a href="zh_CN/">中文文档</a>
        <a href="en/">English documentation</a>
    </nav>
</body>
</html>
