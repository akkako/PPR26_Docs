name: Build Python Tools (Win32)

on:
  push:
    branches: [main]
    paths:
      # 只有上位机（Python 工具）代码或其工作流发生变化时才构建
      - "tools/**"
      - ".github/workflows/build-tools.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-win32:
    name: Build Win32 executable
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11 (x86)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x86"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r tools/requirements.txt

      - name: Download libusb (32-bit)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/libusb/libusb/releases/download/v1.0.27/libusb-1.0.27.7z'
          Invoke-WebRequest -Uri $url -OutFile 'libusb.7z'

          $sevenZip = (Get-Command 7z -ErrorAction SilentlyContinue).Source
          if (-not $sevenZip) { $sevenZip = 'C:\Program Files\7-Zip\7z.exe' }
          & $sevenZip x 'libusb.7z' -o'libusb' -y | Out-Null

          $dll = Get-ChildItem -Path 'libusb' -Recurse -Filter 'libusb-1.0.dll' |
                 Where-Object { $_.FullName -match 'MS32' } | Select-Object -First 1
          if (-not $dll) {
            $dll = Get-ChildItem -Path 'libusb' -Recurse -Filter 'libusb-1.0.dll' |
                   Select-Object -First 1
          }
          if (-not $dll) { throw 'libusb-1.0.dll not found in the archive' }
          Copy-Item $dll.FullName 'libusb-1.0.dll' -Force
          Get-Item 'libusb-1.0.dll' | Format-List Name, Length

      - name: Build with PyInstaller
        run: >
          pyinstaller --onefile --name PPR26_Bootloader
          --icon tools/resistor_box_logo.ico
          --add-binary "libusb-1.0.dll;."
          --collect-submodules usb
          tools/winusb_bootloader.py

      - name: Assemble release files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path 'release' | Out-Null
          Copy-Item 'dist/PPR26_Bootloader.exe' 'release/' -Force
          Copy-Item 'tools/winusb_bootloader.py' 'release/' -Force
          Copy-Item 'tools/requirements.txt' 'release/' -Force
          Copy-Item 'libusb-1.0.dll' 'release/' -Force
          Compress-Archive -Path 'release/*' -DestinationPath 'PPR26_Bootloader_win32.zip' -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PPR26_Bootloader_win32
          path: |
            dist/PPR26_Bootloader.exe
            PPR26_Bootloader_win32.zip

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tools-${{ github.sha }}
          name: "PPR26 Python Tool (Win32)"
          body: |
            PPR26 Python 上位机自动构建（Windows 32 位）。

            - `PPR26_Bootloader.exe`：打包好的可执行文件（内置 libusb，双击或命令行运行）
            - `PPR26_Bootloader_win32.zip`：可执行文件 + Python 脚本 + libusb 的压缩包
            - `winusb_bootloader.py`：Python 脚本
            - `requirements.txt`：Python 依赖（pyusb）
            - `libusb-1.0.dll`：Windows 下 Python 脚本所需的 libusb 后端

            使用说明：https://akkako.github.io/PPR26_Docs/docs/software/downloads/
          files: |
            dist/PPR26_Bootloader.exe
            release/winusb_bootloader.py
            release/requirements.txt
            release/libusb-1.0.dll
            PPR26_Bootloader_win32.zip
          make_latest: true
