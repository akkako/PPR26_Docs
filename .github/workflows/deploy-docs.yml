name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install MkDocs and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs mkdocs-material

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install esbuild
        run: |
          # 仅用于压缩发布产物里的 JS/CSS；固定版本，避免上游更新导致产物悄悄变化
          npm install --global esbuild@0.28.2
          esbuild --version

      - name: Build Chinese documentation
        run: mkdocs build --config-file docs/mkdocs.yml

      - name: Build English documentation
        run: mkdocs build --config-file docs/mkdocs.en.yml

      - name: Assemble static site
        run: |
          # 组装发布目录：入口页在根目录，文档放 /docs/，工具放 /bootloader/、/serial/ 与 /ntcsim/
          rm -rf site
          mkdir -p site/docs site/bootloader site/serial site/ntcsim

          # 1) 两份 MkDocs 构建产物（docs/site/zh_CN、docs/site/en）-> /docs/
          cp -r docs/site/. site/docs/

          # 2) 文档首页：按浏览器语言跳转到 /docs/zh_CN/ 或 /docs/en/
          cp docs/index.html site/docs/index.html

          # 3) 入口页 -> 根目录
          cp -r webui/portal/. site/

          # 4) Bootloader 升级工具 -> /bootloader/
          cp -r webui/bootloader/. site/bootloader/

          # 5) 串口上位机（WebSerial）-> /serial/
          cp -r webui/serial/. site/serial/

          # 6) NTC 模拟器（WebSerial + 本地 NTC 算法模块）-> /ntcsim/
          cp -r webui/ntcsim/. site/ntcsim/

          # 7) 固件（VERSION + 发布镜像）-> /firmware/
          #    升级工具、串口上位机与 NTC 模拟器用 ../firmware/VERSION 判断最新版本：
          #    第一行版本号，第二行固件文件名（与 VERSION 同目录）。
          mkdir -p site/firmware
          cp -r firmware/. site/firmware/

      - name: Minify site assets
        run: |
          # 发布产物瘦身：JS/CSS 压缩、HTML 去注释、search_index.json 紧凑化、删 sourcemap、
          # 资源引用加内容哈希（脚本会打印处理前后的体积对比；详见脚本头部说明）
          python .github/scripts/minify_site.py site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
