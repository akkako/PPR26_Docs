name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install MkDocs and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs mkdocs-material mkdocs-exporter

      - name: Install Playwright browser
        run: playwright install chromium

      - name: Build MkDocs site
        run: mkdocs build --config-file docs/mkdocs.yml

      - name: Assemble static site
        run: |
          # 组装发布目录：入口页在根目录，文档放 /docs/，工具放 /bootloader/ 与 /serial/
          rm -rf site
          mkdir -p site/docs site/bootloader site/serial

          # 1) MkDocs 构建产物 -> /docs/
          cp -r docs/site/. site/docs/

          # 2) 入口页 -> 根目录
          cp -r webui/portal/. site/

          # 3) Bootloader 升级工具 -> /bootloader/
          cp -r webui/bootloader/. site/bootloader/

          # 4) 串口上位机占位页 -> /serial/
          cp -r webui/serial/. site/serial/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
